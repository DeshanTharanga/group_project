x-app: &app
  build: .
  env_file: .env
  environment:
    DB_HOST: postgres
    DB_PORT: 5432
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    PRIVATE_UPLOAD_DIR: /app/data/private_uploads
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_credentials
  volumes:
    - private_uploads:/app/data/private_uploads
  secrets:
    - firebase_credentials
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-medilink}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *app
    command: [celery, -A, app.workers.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  beat:
    <<: *app
    command: [celery, -A, app.workers.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

secrets:
  firebase_credentials:
    file: ${FIREBASE_CREDENTIALS_FILE:?Set FIREBASE_CREDENTIALS_FILE to your service-account JSON path}
volumes:
  pgdata:
  redisdata:
  private_uploads:
