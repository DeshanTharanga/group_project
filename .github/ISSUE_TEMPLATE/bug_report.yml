name: Bug report
description: Report a reproducible issue in the MediLink backend.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real patient information, credentials, tokens, or private documents."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short, clear description of the issue.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: jira
    attributes:
      label: Related Jira issue
      placeholder: ML-123
